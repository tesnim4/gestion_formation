<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulaire Apprenant</title>
    <style>
        :root { --primary: #4f46e5; --primary-dark: #4338ca; --bg-from: #eef2ff; --bg-to: #e0e7ff; --border: #d1d5db; --text: #1f2937; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, var(--bg-from), var(--bg-to)); color: var(--text); }
        .container { width: 100%; max-width: 600px; background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15); margin: 20px; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        .btn-cancel { display: block; text-align: center; margin-top: 16px; color: #6b7280; text-decoration: none; font-size: 0.9rem; }
        .btn-cancel:hover { color: var(--text); text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${apprenant.id != null ? 'Modifier l Apprenant' : 'Ajouter un Apprenant'}">Formulaire</h2>

    <form th:action="@{/apprenants/save}" th:object="${apprenant}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>CIN :</label>
            <input type="text" th:field="*{cin}" />
        </div>

        <div class="form-group">
            <label>Nom :</label>
            <input type="text" th:field="*{nom}" required />
        </div>

        <div class="form-group">
            <label>Prénom :</label>
            <input type="text" th:field="*{prenom}" required />
        </div>

        <div class="form-group">
            <label>Date de Naissance :</label>
            <input type="date" th:field="*{dateNaissance}" />
        </div>

        <div class="form-group">
            <label>Email (Identifiant de connexion) :</label>
            <input type="email" th:field="*{email}" required placeholder="ex: apprenant@test.com" />
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e7eb;">

        <div class="form-group">
            <label>Numéro Apprenant :</label>
            <input type="text" th:field="*{numero}" />
        </div>

        <div class="form-group">
            <label>Date 1ère Inscription :</label>
            <input type="date" th:field="*{datePremiereInscription}" />
        </div>

        <button type="submit" class="btn-submit">Enregistrer</button>
        <a th:href="@{/apprenants}" class="btn-cancel">Annuler</a>
    </form>
</div>
</body>
</html>
