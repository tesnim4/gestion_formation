<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Connexion - Gestion Formations</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-from: #eef2ff;
            --bg-to: #e0e7ff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
            --error-border: #fecaca;
            --success-bg: #f0fdf4;
            --success-text: #15803d;
            --success-border: #bbf7d0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
        }

        h2 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        .alert {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }

        .alert-error {
            color: var(--error-text);
            background: var(--error-bg);
            border-color: var(--error-border);
        }

        .alert-success {
            color: var(--success-text);
            background: var(--success-bg);
            border-color: var(--success-border);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            font-size: 1rem;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover { background: var(--primary-dark); }
        button[type="submit"]:active { transform: scale(0.98); }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Connexion</h2>

        <div th:if="${param.error}" class="alert alert-error">
            Email ou mot de passe incorrect.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Vous avez été déconnecté avec succès.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Adresse Email :</label>
                <!-- autocomplete="off" empêche le navigateur de garder les anciennes valeurs -->
                <input type="email" name="username" placeholder="ex: admin@test.com" required autocomplete="off" />
            </div>
            
            <div class="form-group">
                <label>Mot de passe :</label>
                <input type="password" name="password" required autocomplete="new-password" />
            </div>
            
            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
