<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Accueil</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-from: #eef2ff;
            --bg-to: #e0e7ff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        /* Bandeau utilisateur */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .user-bar strong {
            color: var(--primary);
        }

        a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        hr {
            margin: 24px 0;
            border: none;
            border-top: 1px solid var(--border);
        }

        /* Menu de navigation */
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .menu a {
            text-decoration: none;
        }

        button {
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Bouton de déconnexion */
        form button[type="submit"] {
            padding: 8px 16px;
            background: var(--danger);
        }

        form button[type="submit"]:hover {
            background: var(--danger-dark);
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .menu {
                flex-direction: column;
            }

            .menu a,
            .menu button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>APPLICATION DE GESTION DES FORMATIONS</h1>

        <div class="user-bar" sec:authorize="isAuthenticated()">
            <span>Bienvenue, <strong><span sec:authentication="name"></span></strong> !</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit">Déconnexion</button>
            </form>
        </div>
        <div class="user-bar" sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Se connecter</a>
        </div>

        <hr>

        <div class="menu">
    <a th:href="@{/}"><button>Accueil</button></a>

    <a sec:authorize="hasAnyRole('ADMIN', 'FORMATEUR')" th:href="@{/themes}">
        <button th:text="${#authorization.expression('hasRole(''ADMIN'')')} 
                        ? 'Gestion des thèmes' 
                        : 'Consulter les thèmes'">Gestion des thèmes</button>
    </a>

    <a sec:authorize="hasAnyRole('ADMIN', 'FORMATEUR')" th:href="@{/apprenants}">
        <button th:text="${#authorization.expression('hasRole(''ADMIN'')')} 
                        ? 'Gestion des apprenants' 
                        : 'Consulter les apprenants'">Gestion des apprenants</button>
    </a>

    <a sec:authorize="hasAnyRole('ADMIN', 'FORMATEUR', 'APPRENANT')" th:href="@{/sessions}">
        <button th:text="${#authorization.expression('hasAnyRole(''ADMIN'',''FORMATEUR'')')} 
                        ? 'Gestion des sessions' 
                        : 'Consulter les sessions'">Gestion des sessions</button>
    </a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/formateurs}">
    <button>Gestion des formateurs</button>
</a>

    <a sec:authorize="hasAnyRole('ADMIN', 'FORMATEUR', 'APPRENANT')" th:href="@{/inscriptions}">
        <button th:text="${#authorization.expression('hasRole(''APPRENANT'')')} 
                        ? 'Mes inscriptions' 
                        : 'Inscriptions'">Inscriptions</button>
    </a>
</div>
    </div>
</body>
</html>
