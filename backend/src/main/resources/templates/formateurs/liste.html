<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des Formateurs</title>
    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #4338ca; --bg-from: #eef2ff; --bg-to: #e0e7ff;
            --text: #1f2937; --border: #e5e7eb; --danger: #dc2626; --danger-dark: #b91c1c; --success: #16a34a;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 32px 16px; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: linear-gradient(135deg, var(--bg-from), var(--bg-to)); }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15); }
        h1 { margin: 0 0 20px; text-align: center; font-size: 1.6rem; font-weight: 700; color: var(--primary); }
        
        .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 16px; }
        .toolbar a { text-decoration: none; }
        
        button, .btn { display: inline-block; padding: 10px 20px; font-weight: 600; color: #fff; background: var(--primary); border: none; border-radius: 8px; cursor: pointer; text-decoration: none; transition: 0.2s; }
        button:hover, .btn:hover { background: var(--primary-dark); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-dark); }
        
        .alert { margin: 16px 0; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; text-align: center; }
        .alert-success { background: #dcfce7; color: var(--success); border: 1px solid #86efac; }
        .alert-error { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; }

        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; }
        th { font-size: 0.85rem; text-transform: uppercase; color: #fff; background-color: var(--primary); }
        td { border-top: 1px solid var(--border); }
        tbody tr:nth-child(even) { background-color: #f9fafb; }
        tbody tr:hover { background-color: #eef2ff; }
        .actions form { display: inline; }
    </style>
</head>
<body>
<div class="container">
    <h1>Gestion des Formateurs</h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="toolbar">
        <a th:href="@{/formateurs/nouveau}"><button>Ajouter un formateur</button></a>
        <a th:href="@{/}"><button>Retour à l'accueil</button></a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Grade</th>
                    <th>Fonction</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${formateurs}">
                    <td th:text="${f.id}"></td>
                    <td th:text="${f.nom}"></td>
                    <td th:text="${f.prenom}"></td>
                    <td th:text="${f.grade}"></td>
                    <td th:text="${f.fonction}"></td>
                    <td class="actions">
                        <a th:href="@{/formateurs/{id}/edit(id=${f.id})}">
                            <button class="btn-sm">Modifier</button>
                        </a>
                        <form th:action="@{/formateurs/{id}/delete(id=${f.id})}" method="post" onsubmit="return confirm('Supprimer ce formateur ?');">
                            <button type="submit" class="btn-sm btn-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(formateurs)}">
                    <td colspan="6" style="text-align: center; padding: 24px; font-style: italic; color: #6b7280;">Aucun formateur enregistré.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
