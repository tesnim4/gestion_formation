<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste des Sessions</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-from: #eef2ff;
            --bg-to: #e0e7ff;
            --text: #1f2937;
            --border: #e5e7eb;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .toolbar a {
            text-decoration: none;
        }

        button,
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover,
        .btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        button:active,
        .btn:active {
            transform: scale(0.97);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-dark);
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
        }

        .alert {
            margin: 16px 0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .alert-success {
            background: #dcfce7;
            color: var(--success);
            border: 1px solid #86efac;
        }

        .alert-error {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .table-wrapper {
            margin-top: 24px;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            white-space: nowrap;
            vertical-align: middle;
        }

        th {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            background-color: var(--primary);
        }

        td {
            border-top: 1px solid var(--border);
        }

        tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        tbody tr:hover {
            background-color: #eef2ff;
        }

        .actions form {
            display: inline;
        }

        .empty {
            text-align: center;
            padding: 24px;
            color: #6b7280;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            text-align: center;
        }

        .badge-encours {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .badge-termine {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .badge-avenir {
            background: #fef08a;
            color: #854d0e;
            border: 1px solid #fde047;
        }

        .badge-inconnu {
            background: #e5e7eb;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar a,
            .toolbar button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Gestion des Sessions</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="toolbar">
            <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')" th:href="@{/sessions/nouvelle}">
                <button>Nouvelle session</button>
            </a>
            <a th:href="@{/}"><button>Retour à l'accueil</button></a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Thème</th>
                        <th>Formateur</th>
                        <th>Début</th>
                        <th>Fin</th>
                        <th>Statut</th>
                        <th sec:authorize="hasAnyRole('ADMIN','FORMATEUR')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${sessions}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.description}"></td>
                        <td th:text="${s.themeFormation != null ? s.themeFormation.theme : 'N/A'}"></td>
                        <td
                            th:text="${s.formateur != null ? s.formateur.prenom + ' ' + s.formateur.nom : 'Non assigné'}">
                        </td>

                        <td th:text="${s.datebut != null ? #temporals.format(s.datebut, 'dd/MM/yyyy') : '-'}"></td>
                        <td th:text="${s.datefin != null ? #temporals.format(s.datefin, 'dd/MM/yyyy') : '-'}"></td>

                        <td th:with="aujourdhui=${#temporals.createToday()}">
                            <th:block th:if="${s.datebut != null and s.datefin != null}">

                                <span th:if="${aujourdhui.isBefore(s.datebut)}" class="badge badge-avenir">En attente</span>

                                <span th:if="${aujourdhui.isAfter(s.datefin)}"
                                    class="badge badge-termine">Terminé</span>

                                <span th:if="${!aujourdhui.isBefore(s.datebut) and !aujourdhui.isAfter(s.datefin)}"
                                    class="badge badge-encours">En cours</span>
                            </th:block>

                            <th:block th:if="${s.datebut == null or s.datefin == null}">
                                <span class="badge badge-inconnu">Non défini</span>
                            </th:block>
                        </td>

                        <td sec:authorize="hasAnyRole('ADMIN','FORMATEUR')" class="actions">
                            <a th:href="@{/sessions/{id}/edit(id=${s.id})}">
                                <button class="btn btn-sm">Modifier</button>
                            </a>
                            <form th:action="@{/sessions/{id}/delete(id=${s.id})}" method="post"
                                onsubmit="return confirm('Supprimer cette session ?');">
                                <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sessions)}">
                        <td colspan="8" class="empty">
                            Aucune session
                            <span sec:authorize="hasRole('APPRENANT')">à laquelle vous êtes inscrit(e)</span>.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
