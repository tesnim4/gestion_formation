<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Sessions</title>
    <style>
        table { width: 80%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Gestion des Sessions</h1>
    <a th:href="@{/sessions/nouvelle}"><button>Nouvelle session</button></a>
    <a th:href="@{/}"><button>Retour à l'accueil</button></a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Thème</th>
                <th>Formateur</th>
                <th>Début</th>
                <th>Fin</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${sessions}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.description}"></td>
                <td th:text="${s.themeFormation != null ? s.themeFormation.theme : 'N/A'}"></td>
                <td th:text="${s.formateur != null ? s.formateur.prenom + ' ' + s.formateur.nom : 'Non assigné'}"></td>
                <td th:text="${s.datebut}"></td>
                <td th:text="${s.datefin}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
