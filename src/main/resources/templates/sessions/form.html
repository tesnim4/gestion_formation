<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editMode} ? 'Modifier la Session' : 'Nouvelle Session'"></title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-from: #eef2ff;
            --bg-to: #e0e7ff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .alert {
            margin: 0 0 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        select {
            cursor: pointer;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        button[type="submit"] {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background: var(--primary-dark);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        a {
            color: var(--muted);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <div class="card">

        <h1 th:text="${editMode} ? 'Modifier la Session' : 'Créer une Session de Formation'"></h1>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/sessions/save}" th:object="${session}" method="post">

            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label>Description : </label>
                <input type="text" th:field="*{description}" required>
            </div>

            <div class="form-group">
                <label>Thème : </label>
                <select th:field="*{themeFormation.id}" required>
                    <option value="">-- Sélectionner un thème --</option>
                    <option th:each="t : ${themes}" th:value="${t.id}" th:text="${t.theme}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Formateur : </label>
                <select th:field="*{formateur.id}" required>
                    <option value="">-- Sélectionner un formateur --</option>
                    <option th:each="f : ${formateurs}" th:value="${f.id}" th:text="${f.prenom + ' ' + f.nom}"></option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date début : </label>
                    <input type="date" th:field="*{datebut}" required>
                </div>

                <div class="form-group">
                    <label>Date fin : </label>
                    <input type="date" th:field="*{datefin}" required>
                </div>
            </div>

            <div class="actions">
                <button type="submit" th:text="${editMode} ? 'Mettre à jour' : 'Enregistrer'"></button>
                <a th:href="@{/sessions}">Annuler</a>
            </div>
        </form>
    </div>
</body>

</html>
