<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Liste des Inscriptions</title>
    <style>
        table {
            width: 70%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Gestion des Inscriptions</h1>
    <a th:href="@{/inscriptions/nouvelle}"><button>Nouvelle inscription</button></a>
    <a th:href="@{/}"><button>Retour à l'accueil</button></a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date Inscription</th>
                <th>Apprenant</th>
                <th>Session</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="i : ${inscriptions}">
                <td th:text="${i.id}"></td>
                <td th:text="${i.dateInscription}"></td>
                <td th:text="${i.apprenant != null ? i.apprenant.prenom + ' ' + i.apprenant.nom : ''}"></td>
                <td th:text="${i.sessionFormation != null ? i.sessionFormation.description : ''}"></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
