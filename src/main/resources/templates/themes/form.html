<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouveau Thème</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-from: #eef2ff;
            --bg-to: #e0e7ff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            font-size: 1rem;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        button[type="submit"] {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background: var(--primary-dark);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        a {
            color: var(--muted);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Créer un Thème</h1>
        <form th:action="@{/themes/save}" th:object="${theme}" method="post">
            <div class="form-group">
                <label>Intitulé : </label>
                <input type="text" th:field="*{theme}" required>
            </div>

            <div class="form-group">
                <label>Mots-clés : </label>
                <input type="text" th:field="*{motsCles}">
            </div>

            <div class="actions">
                <button type="submit">Enregistrer</button>
                <a th:href="@{/themes}">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
