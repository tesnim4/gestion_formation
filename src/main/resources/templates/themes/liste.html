<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Thèmes</title>
    <style>
        table { width: 50%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Gestion des Thèmes</h1>
    <a th:href="@{/themes/nouveau}"><button>Créer un nouveau thème</button></a>
    <a th:href="@{/}"><button>Retour à l'accueil</button></a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Intitulé</th>
                <th>Mots-clés</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${themes}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.theme}"></td>
                <td th:text="${t.motsCles}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
