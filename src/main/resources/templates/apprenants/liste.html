<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste des Apprenants</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-from: #eef2ff;
            --bg-to: #e0e7ff;
            --text: #1f2937;
            --border: #e5e7eb;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .toolbar a { text-decoration: none; }

        button, .btn {
            display: inline-block;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        button:hover, .btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        button:active, .btn:active { transform: scale(0.97); }

        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-dark); }

        .alert { margin: 16px 0; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; }
        .alert-success { background: #dcfce7; color: var(--success); border: 1px solid #86efac; }
        .alert-error   { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; }

        .table-wrapper {
            margin-top: 24px;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; }
        th {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            background-color: var(--primary);
        }
        td { border-top: 1px solid var(--border); }
        tbody tr:nth-child(even) { background-color: #f9fafb; }
        tbody tr:hover { background-color: #eef2ff; }

        .actions form { display: inline; }
        .empty { text-align: center; padding: 24px; color: #6b7280; font-style: italic; }

        @media (max-width: 600px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 1.25rem; }
            .toolbar { flex-direction: column; }
            .toolbar a, .toolbar button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Gestion des Apprenants</h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="toolbar">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/apprenants/nouveau}">
            <button>Ajouter un apprenant</button>
        </a>
        <a th:href="@{/}"><button>Retour à l'accueil</button></a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Numéro</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${apprenants}">
                <td th:text="${a.id}"></td>
                <td th:text="${a.numero}"></td>
                <td th:text="${a.nom}"></td>
                <td th:text="${a.prenom}"></td>
                <td th:text="${a.email}"></td>
                <td sec:authorize="hasRole('ADMIN')" class="actions">
                    <a th:href="@{/apprenants/{id}/edit(id=${a.id})}">
                        <button class="btn btn-sm">Modifier</button>
                    </a>
                    <form th:action="@{/apprenants/{id}/delete(id=${a.id})}" method="post"
                          onsubmit="return confirm('Supprimer cet apprenant ?');">
                        <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(apprenants)}">
                <td colspan="6" class="empty">Aucun apprenant enregistré.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
